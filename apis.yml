name: SiftingIO
description: >-
  Cross-asset market data APIs covering US equities, forex, cryptocurrency, DeFi/on-chain, commodities,
  and SEC/EDGAR fundamentals, aggregated across venues and normalized into one JSON schema so every asset
  class shares the same fields, auth model and integration flow. Delivered over REST (37 operations under a
  public OpenAPI 3.1 contract), a WebSocket stream described by a public AsyncAPI 3.0 contract, and a
  documented FIX 4.4 market-data feed. Fundamentals cover filings, filing-text extraction and risk-factor
  diffs, XBRL financials, ratios, insiders, ownership and 13F holdings; reference data covers market status,
  hours and holiday calendars; derived data covers technical signals and on-chain TVL. Official Go, Python
  and JavaScript SDKs, an open-source (locally-run) MCP server with 36 tools, and a provider-published agent
  ruleset. Operated by SaltingIO LLC, a Wyoming company; explicitly not a broker, exchange or trading venue.

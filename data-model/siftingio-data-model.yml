entry_points:
  - {operation: searchStocks, resolves: 'free text -> ticker + cik', note: 'The documented first call — "resolve a ticker through the search endpoint to verify your key is live before pulling deeper data."'}
  - {operation: listMarkets, resolves: 'region -> market slug', note: 'Discover the market slug every other markets_* route expects.'}
  - {operation: null, resolves: 'symbol discovery', note: 'The symbol catalog is a WEB page (https://sifting.io/symbols), not an API operation — there is no listSymbols endpoint. An agent must either know the symbol or search only within US equities.'}

observations:
  - >-
    The unified-schema claim is real and checkable: one Bar shape {t,o,h,l,c,v} serves stocks,
    forex, crypto, commodities and DEX, and one ListMeta cursor envelope serves every list.
  - >-
    Provenance is carried in the data, not just the docs: screener rows, insider transactions,
    ownership, compensation and events all cite the SEC accession they were extracted from, so a
    consumer can trace any derived number back to a filing.
  - >-
    Two joins are unreachable inside the API. CUSIP (13F positions) has no resolver to ticker or
    CIK, and there is no symbol-listing operation — both require an out-of-band mapping.


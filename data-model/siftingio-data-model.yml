note: >-
  Entity graph derived from the 75 component schemas, their $ref links and their id-reference
  fields, cross-checked against the identifier rules published in the quickstart Conventions
  section. This is a READ-ONLY reference data model: there are no customer-owned resources, no
  create/update/delete operations and therefore no ownership relationships — every entity is a
  projection of an external reality (a security, a venue, an SEC filing, an on-chain wallet) keyed
  by a natural identifier rather than a provider-issued surrogate id. That is why no entity has an
  `id` field and no id-prefix scheme exists.

identifier_scheme:
  provider_issued_ids: false
  id_prefixes: []
  id_prefix_note: >-
    SiftingIO issues no object ids and uses no prefixed id scheme. Everything is addressed by a
    natural key. The only prefixed identifier in the whole surface is the API key itself (sft_).
  natural_keys:
    - {key: ticker, form: 'case-insensitive string (AAPL = aapl)', domain: US equities, registry: SEC US ticker registry}
    - {key: cik, form: 10-digit zero-padded string ("0000320193"), domain: SEC filers}
    - {key: accession, form: 'dashed on output ("0000320193-25-000089"); dashed or undashed accepted on input', domain: SEC filings}
    - {key: cusip, form: 9-character string, domain: 13F holdings positions}
    - {key: venue, form: venue slug, domain: live market data}
    - {key: symbol, form: 'venue symbol (BTCUSD, AAPL, EURUSD, XAUUSD, WTIUSD)', domain: all price data}
    - {key: pair, form: 'FX pair (EURUSD) or canonical DEX pair (WETH-USDC)', domain: forex and DEX}
    - {key: market, form: 'market slug (nyse, us_equities, forex, crypto)', domain: market reference}
    - {key: chain, form: 'EVM chain slug', domain: on-chain}
    - {key: address, form: '0x wallet address', domain: on-chain}
    - {key: concept, form: XBRL concept name, domain: financials}
    - {key: taxonomy, form: XBRL taxonomy name, domain: financials}
    - {key: event_id, form: string, domain: economic calendar}

domains:
  - domain: live
    tag: Live
    entities: [LastTrade, LastQuote, LastClose, LastTVL, SnapshotEntry, SnapshotResponse]
    keyed_by: [venue, symbol]
    note: 'Compact wire shapes — LastTrade is {s,p,P,t} (symbol, price, size, epoch-ms). Never cached; 503 stale_snapshot past the freshness threshold.'
  - domain: historical
    tag: [Stocks, Forex, Crypto, Commodities, DEX]
    entities: [Bar, BarsResponse, BarsMeta]
    keyed_by: [symbol or ticker or pair, interval, time window]
    note: 'ONE Bar shape {t,o,h,l,c,v} across every asset class — this is the "unified JSON schema" claim, and it holds in the spec.'
  - domain: company
    tag: Stocks
    entities: [CompanyProfile, StockSearchResult, StockSearchResponse]
    keyed_by: [ticker, cik]
  - domain: sec-filings
    tag: Stocks
    entities: [Filing, FilingDetail, FilingRef, FilingsResponse, FilingSection, FilingSectionDetail, FilingSections, RiskFactorsDiff, SectionDiff, SectionDiffStats, DiffPair, EventFiling, EventFilingsResponse]
    keyed_by: [ticker, accession, section]
  - domain: financials
    tag: Stocks
    entities: [Financials, ConceptBlock, FinancialConcept, MetricValue, Ratios, FinancialRatio, ScreenerResult, ScreenerRow]
    keyed_by: [ticker, cik, taxonomy, concept, period]
  - domain: ownership
    tag: [Stocks, Filers]
    entities: [InsiderTransaction, InsidersResponse, OwnershipFiling, OwnershipResponse, CompensationFiling, CompensationResponse, Holdings, HoldingPosition]
    keyed_by: [ticker, filer (ticker or CIK), cusip]
  - domain: reference
    tag: Markets
    entities: [Market, MarketStatus, MarketHours, MarketHoursBlock, HoursSpec, HoursBreak, ForexSession, CalendarDay, MarketStats, MarketsListResponse, MarketsStatusAllResponse, MarketStatusResponse, MarketHoursResponse, MarketCalendarResponse]
    keyed_by: [market, region]
  - domain: macro
    tag: EconomicCalendar
    entities: [EconomicEvent, EconomicCalendarResponse]
    keyed_by: [event_id, country, agency, date range]
  - domain: signals
    tag: Signals
    entities: [LiveSignal, LiveSignalResponse, SignalSummary, SignalVerdict, SignalGroup, SignalIndicator, SignalVote, SignalCounts, SignalPoint, SignalEvent, SignalPrice, SignalHistoryResponse, SignalMeta]
    keyed_by: [venue, symbol, interval]
    note: 'Newest domain (shipped 2026-08-14). The summary carries the per-indicator votes behind the verdict — an unusually transparent derived-metric shape.'
  - domain: on-chain
    tag: DEX
    entities: [WalletPortfolio, WalletToken, LastTVL]
    keyed_by: [chain, address, pair]
  - domain: convert
    tag: Convert
    entities: [ConvertResult]
    keyed_by: [from, to]
  - domain: envelope
    entities: [ListMeta, BarsMeta, SignalMeta, Error]
    note: Cross-cutting response envelopes, not business entities.


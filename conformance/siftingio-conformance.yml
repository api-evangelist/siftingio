regulatory_posture:
  self_declaration: >-
    SiftingIO publishes an unusually explicit negative scope statement in its site-wide
    disclosure: the service is operated by SaltingIO LLC (a Wyoming LLC) and is "not an exchange,
    broker, dealer, market maker, custodian, liquidity provider, or financial institution, and
    does not execute, route, match, or settle trades."
  redistribution_position: >-
    "The Service does not redistribute raw primary exchange feeds, official exchange-of-record
    prices, last-sale data, order books, or any venue's proprietary data; outputs are synthetic
    reference values produced by SaltingIO's aggregation, normalization, and fair-price
    methodologies."
  disclosure_url: https://sifting.io/disclaimer
  methodology_url: https://sifting.io/data-methodology
  significance: >-
    This is the licensing question every market data buyer asks first, answered in public and in
    writing. It also means the data is explicitly derived/synthetic, not exchange-of-record —
    material to anyone evaluating it for a regulated use.


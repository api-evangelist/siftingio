  maintained in the github.com/SiftingIO organization and generated against the same public
  OpenAPI 3.1 and AsyncAPI 3.0 documents. Versions and publish dates below were read from each
  registry's metadata endpoint on 2026-08-17. The Python MCP server is the one first-party
  artifact with NO registry release: pyproject.toml declares name "siftingio-mcp" version 1.0.0
  but pypi.org/pypi/siftingio-mcp/json returned 404, so it is installable from source only.

  cadence: roughly two to four entries a month
  breaking_changes_in_window: 0
  deprecations_in_window: 0
  additive_only: true
  observation: >-
    Eight of the eleven entries are new endpoints or new surfaces in a three-month window, and
    none is breaking — consistent with the published "fields are additive, never removed within a
    version" promise. The corollary is a currency problem downstream: the MCP server (last cut
    2026-07-11) and the three SDKs (all 2026-08-02) predate the 2026-08-14 signals endpoints, so
    the newest capability is REST-only for now. See rest_only[] in

versioning:
  scheme: uri-path
  current: v1
  docs: https://sifting.io/docs/quickstart
  statement: >-
    "Every endpoint is pinned to v1, baked right into the path (e.g. /v1/fnd/stocks/search).
    Within a version, fields are additive, never removed. Breaking changes ship under a new
    version with a deprecation window."
  additive_only_within_version: true
  header_or_date_versioning: false

deprecation:
  policy_url: https://sifting.io/docs/quickstart
  policy_statement: 'Breaking changes ship under a new version with a deprecation window.'
  policy_kind: published commitment on the Conventions section of the quickstart, not a dedicated policy page
  deprecation_window_length: not specified
  sunset_header: null
  deprecation_header: null
  rfc8594: false
  header_note: >-
    RFC 8594 Sunset / RFC 9745 Deprecation response headers are NOT documented and do not appear
    anywhere in the OpenAPI. The commitment is editorial: a new version path plus a window, with
    no machine-readable signal on the wire for a client to detect. Worth raising with the
    provider — they already carry the two hardest parts (a stable version path and an
    additive-only promise) and are one response header away from a machine-detectable
    deprecation.
  deprecations_observed: 0
  changelog_window_checked: '2026-05-03 to 2026-08-14 — no entry marked breaking or deprecating'

deprecated_operations: []
deprecated_operations_note: 'No operation in any of the 11 refined specs carries `deprecated: true`.'


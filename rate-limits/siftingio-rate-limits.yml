note: >-
  SiftingIO publishes a dedicated "Errors & rate limits" operations page that gives an agent
  everything it needs at runtime: the exact response headers, the exhaustion status code, the
  error code to switch on, and the numeric budgets per tier. Two INDEPENDENT limits apply — a
  monthly call quota and a per-second (Free: per-minute) rate limit — and both are enforced PER
  MARKET at that market's tier, so one account can run Stocks on Pro and Crypto on Builder with
  separately enforced budgets. The 429 + Retry-After contract is also present in the OpenAPI:
  components.responses.TooManyRequests declares the Retry-After header, and every one of the 37
  operations declares a 429 response.

headers:
  - name: X-RateLimit-Limit
    meaning: Token bucket burst capacity for your subscription tier.
    on: every REST response
  - name: X-RateLimit-Remaining
    meaning: Tokens remaining in the current window.
    on: every REST response
  - name: Retry-After
    meaning: Seconds to wait before retrying.
    on: 429 responses
    in_openapi: true
    openapi_ref: components.responses.TooManyRequests.headers.Retry-After (integer)
header_style: X-RateLimit-* (de-facto draft form, not the RFC 9331 RateLimit-* field names)
self_throttle_guidance: >-
  "Every REST response carries these. Read them to self-throttle before you hit a 429." —
  https://sifting.io/docs/errors

exhaustion:

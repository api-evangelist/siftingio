websocket_note: >-
  The AsyncAPI document (asyncapi/siftingio-asyncapi.yaml) documents no rate-limit frame; the
  stream's control surface is subscribe/unsubscribe/ping with ack/pong/error replies. Quota
  enforcement on the stream is by connection and subscription count, not by message rate.


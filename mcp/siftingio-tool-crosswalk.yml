mcp_only:
  - tool: ws_subscribe
    reason: >-
      Wraps the AsyncAPI `subscribe` send-operation on wss://stream.sifting.io/ws/v1. No REST
      operation exists — subscribing is a stateful WebSocket frame, not a request.
    binding: asyncapi
    asyncapi_operation: subscribe
  - tool: ws_unsubscribe
    reason: Wraps the AsyncAPI `unsubscribe` send-operation. No REST equivalent.
    binding: asyncapi
    asyncapi_operation: unsubscribe
  - tool: ws_poll
    reason: >-
      Server-side composite with no protocol equivalent on either surface. The MCP server keeps
      a local ring buffer of received tick frames and this tool drains it by sequence number
      (afterSeq). Exists because MCP is request/response and cannot push a stream to the model.
    binding: composite
  - tool: ws_collect
    reason: >-
      Server-side composite: opens a subscription, blocks for duration_ms (default 3000), and
      returns up to `max` (default 50) buffered ticks in one response. A synchronous window over
      an asynchronous stream — an MCP-shaped affordance that neither REST nor the WebSocket
      protocol offers.
    binding: composite
  - tool: ws_status
    reason: Reports the local WebSocket manager's connection state. Client-side state, not a provider surface.
    binding: composite
  - tool: ws_disconnect
    reason: Tears down the local WebSocket connection. Client-side state, not a provider surface.
    binding: composite

rest_only:
  - capability: Commodities historical bars
    rest: [getCommodityBars]
    path: /v1/hist/commodities/{symbol}/bars
    note: >-
      THE MOST CONSEQUENTIAL GAP. https://sifting.io/llms.txt tells an agent the MCP server's
      36 tools cover "commodities", but no commodities tool exists in the server source —
      src/tools/ has crypto.ts, forex.ts, last.ts, ws.ts, stocks.ts, filers.ts, economic.ts,
      dex.ts and markets.ts, and nothing else. An agent asking for gold or WTI history over MCP
      has no tool to call; it can only get a live snapshot via last_trade/last_quote on a
      commodities venue. Reachable over REST and over all three SDKs.
  - capability: Previous daily close
    rest: [getLastClose]
    path: /v1/last/close/{venue}/{symbol}
    note: >-
      Shipped 2026-07-01 per the changelog; the MCP server's last release is 2026-07-11 and does
      not wrap it. Only last_trade, last_quote and last_tvl of the four /v1/last/* operations
      have tools.
  - capability: Technical signals (live + history)
    rest: [getLiveSignal, getSignalHistory]
    paths: ['/v1/last/signals/{venue}/{symbol}', '/v1/hist/{venue}/{symbol}/signals']
    note: >-
      Shipped 2026-08-14, a month after the MCP server's 1.0.2 release (2026-07-11). Not yet
      exposed as tools. RSI/MACD/moving-average readings are REST-only for agents today.
  - capability: Whole-market snapshot
    rest: [getSnapshot]
    path: /v1/snapshot/{venue}
    note: 'Returns the consensus state of an entire venue in one call. gzip required. No tool.'
  - capability: Currency and token conversion
    rest: [convertAmount]
    path: '/v1/convert/{from}/{to}'
    note: 'Live FX/crypto conversion. Documented at /docs/convert. No tool.'
  - capability: DEX historical bars
    rest: [getDexBars]
    path: '/v1/hist/dex/{symbol}/bars'
    note: >-
      dex_wallet covers wallet portfolios but there is no tool for DEX pool OHLCV history.


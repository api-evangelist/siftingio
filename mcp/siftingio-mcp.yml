server:
  name: io.sifting/mcp
  display_name: SiftingIO market data MCP server
  description: >-
    SiftingIO market data: live crypto/forex/metals prices, OHLCV bars, SEC fundamentals,
    13F data. Returns the same normalized shapes as the REST API, with structuredContent
    alongside the text on the snapshot tools.
  version: 1.0.2
  license: MIT
  transport: stdio
  registry_name: io.sifting/mcp
  registry_schema: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
  implementations:
    - language: typescript
      package: siftingio-mcp
      registry: npm
      version: 1.0.2
      published: '2026-07-11'
      repo: https://github.com/SiftingIO/siftingio-mcp
      sdk_dependency: '@modelcontextprotocol/sdk ^1.29.0'
    - language: python
      package: siftingio-mcp
      registry: none
      version: null
      published: null
      repo: https://github.com/SiftingIO/siftingio-mcp-python
      sdk_dependency: 'mcp>=1.13 (FastMCP)'
      note: >-
        Declares version 1.0.0 in pyproject.toml but is NOT published to PyPI
        (https://pypi.org/pypi/siftingio-mcp/json returned 404 on 2026-08-17). Source install only.

deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y siftingio-mcp
  package: https://www.npmjs.com/package/siftingio-mcp
  auth: api-key
  verified: probed

deployment_evidence:
  claim: >-
    THERE IS NO PROVIDER-HOSTED REMOTE MCP ENDPOINT. The client launches the server on the
    user's own machine and it reads the key from the SIFTING_API_KEY environment variable.
    An agent cannot reach SiftingIO over MCP without a human first installing and running
    this package.
  probes:
    - {url: 'https://mcp.sifting.io/mcp', method: POST tools/list, status: 0, result: DNS does not resolve}
    - {url: 'https://api.sifting.io/mcp', method: POST tools/list, status: 404}
    - {url: 'https://sifting.io/mcp', method: POST tools/list, status: 404}
    - url: 'https://api.sifting.io/v1/mcp'
      method: POST tools/list
      status: 401
      result: >-
        FALSE POSITIVE — discarded. api.sifting.io gates every /v1/* path behind the API key
        BEFORE routing, so a nonsense path returns the identical response: GET
        /v1/definitely-not-a-real-path-zzz also returned 401 {"error":"invalid api key"}. The
        401 is the key gate, not evidence of an MCP endpoint.
  local_http_transport:
    binary: siftingio-mcp-http
    note: >-
      Both implementations ship an optional Streamable HTTP transport, but it is a LOCAL
      transport the user runs themselves (loopback), not a hosted service. It does not make
      this a remote server.
  environment:
    - {name: SIFTING_API_KEY, required: true, secret: true, description: 'SiftingIO API key (get one at https://sifting.io)'}
    - {name: SIFTING_BASE_URL, required: false, secret: false, description: Override the REST API base URL}
    - {name: SIFTING_WS_URL, required: false, secret: false, description: Override the WebSocket URL}

tools_source: >-
  Read from the TypeScript server source (src/tools/**/*.ts at refs/heads/main), not from a
  live tools/list call — there is no hosted endpoint to introspect. Names, titles and the
  backing client calls are verbatim from the source; per-tool inputSchema is Zod in the
  source and is bound to its real OpenAPI operation in mcp/siftingio-tool-crosswalk.yml.


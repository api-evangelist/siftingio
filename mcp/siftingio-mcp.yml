summary:
  tool_count: 36
  tools_backed_by_rest: 30
  tools_streaming_only: 6
  matches_published_claim: true
  claim_source: >-
    "36 tools cover forex, crypto, stocks, commodities, SEC fundamentals and on-chain DEX
    data" — https://sifting.io/llms.txt
  discrepancy: >-
    The published claim names COMMODITIES, but the server source contains no commodities tool:
    there is no commodities_bars tool wrapping getCommodityBars, and no commodities file under
    src/tools/. Commodities are reachable over MCP only through the venue-parameterised
    last_trade / last_quote snapshot tools. See rest_only[] in
    mcp/siftingio-tool-crosswalk.yml.

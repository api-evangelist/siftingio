format_note: >-
  NOT RFC 9457. SiftingIO ships its own two-to-three field JSON envelope
  ({"error","message","retry_after"}) with Content-Type application/json — not
  application/problem+json, and with no `type` URI, `title`, `status` or `instance` member. The
  provider's own guidance is that the snake_case `error` code, not the HTTP status, is the stable
  identifier to switch on: "HTTP status maps loosely to category, the code is what stays stable."
  That is a clear, documented, machine-switchable contract; it just is not the RFC.
envelope:
  content_type: application/json
  schema: components.schemas.Error
  required: [error]
  fields:
    - {name: error, type: string, description: 'Machine-readable snake_case error code, e.g. unknown_ticker. Switch on this.'}
    - {name: message, type: string, description: Human-readable details.}
    - {name: retry_after, type: number, description: Present on rate-limit errors.}
  additional_properties: true
  additional_properties_note: >-
    Several errors enrich the body: section_not_found adds `available` (the sections that were
    extracted), invalid_section adds `valid_options`, stale_snapshot adds `last_t` and
    `server_now`.
  example: '{"error":"error_code","message":"human-readable details"}'

